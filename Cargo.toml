[package]
name = "HDR_STUDIO"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow"] }
glam = "0.30"
earcutr = "0.4"
libloading = "0.8"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "hdr", "exr"] }
glutin = { version = "0.32.3", default-features = false, features = ["wgl"] }
raw-window-handle = "0.6"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

